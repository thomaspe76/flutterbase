name: flutterbase
description: A Production-Ready Flutter Boilerplate.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  go_router: ^17.0.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  url_launcher: ^6.2.2
  package_info_plus: ^9.0.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  dio: ^5.0.0
  flutter_secure_storage: ^10.0.0-beta.5
  local_auth: ^3.0.0
  purchases_flutter: ^9.9.9
  google_mobile_ads: ^6.0.0
  supabase_flutter: ^2.10.3
  google_generative_ai: ^0.4.7
  sentry_flutter: ^9.8.0
  in_app_review: ^2.0.11
  freezed_annotation: ^3.1.0
  dynamic_color: ^1.8.1
  fl_chart: ^1.1.1
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^19.5.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # Referral System
  android_play_install_referrer: ^0.4.0
  share_plus: ^7.2.2
  cloud_firestore: ^5.4.4

  # Utilities
  uuid: ^4.2.1
  connectivity_plus: ^5.0.2
  flutter_dotenv: ^5.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^3.0.3
  build_runner: ^2.4.8
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.3
  freezed: ^3.2.3

flutter:
  uses-material-design: true
  generate: true
